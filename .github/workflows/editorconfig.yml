name: EditorConfig

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editorconfig:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install editorconfig-checker
        uses: editorconfig-checker/action-editorconfig-checker@v3.0.0
        with:
          version: v4.0.2

      - name: Check EditorConfig rules
        run: editorconfig-checker --format github-actions
