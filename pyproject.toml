# https://packaging.python.org/en/latest/guides/writing-pyproject-toml/

[build-system]
requires = ["setuptools>=68,<69"]
build-backend = "setuptools.build_meta"

[project]
name = "puginscript"
version = "0.1.0"
description = "Compiler and processor model for the PuginScript language"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
dev = [
    "pyright>=1.1.414,<1.2",
    "pytest>=9.1.1,<10",
    "ruff>=0.17.6,<0.18",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
namespaces = true

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

# ruff знает про ленивые аннотации
# и не ругается на forward-ссылки
target-version = "py314"
extend-exclude = ["_tmp_*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
#
[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
# для [isa.py](src/machine/isa.py) отключено правило, т.к.
# классы `R`, `I`, `S`, `B` -- имена форматов инструкций
"src/machine/isa.py" = ["E742"]
