# https://packaging.python.org/en/latest/guides/writing-pyproject-toml/

[build-system]
requires = ["setuptools>=68,<69"]
build-backend = "setuptools.build_meta"

[project]
name = "puginscript"
version = "0.1.0"
description = "Compiler and processor model for the PuginScript language"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
dev = [
    "pyright>=1.1.414,<1.2",
    "pytest>=8.4.2,<8.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
namespaces = true

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
